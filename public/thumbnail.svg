  <text x="725" y="428" fill="#f43f5e" font-size="48" font-weight="900">92 / 100</text>
  <rect x="935" y="392" width="150" height="34" rx="17" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" />
  <text x="955" y="414" fill="#fda4af" font-size="13" font-weight="800">PREDATORY UI</text>
  <text x="725" y="476" fill="#cbd5e1" font-size="16" font-weight="600">Advertised: $9.99  →  True Cost: $49.96</text>

