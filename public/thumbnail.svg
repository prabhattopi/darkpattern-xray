  <text x="135" y="528" fill="#fdba74" font-size="15" font-weight="700">Hidden Platform + Setup Fees (+$27.99)</text>

  <rect x="115" y="584" width="510" height="62" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="2.5" />
  <rect x="115" y="566" width="155" height="22" rx="4" fill="#ca8a04" />
