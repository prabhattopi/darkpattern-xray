  <rect x="115" y="382" width="175" height="22" rx="4" fill="#e11d48" />
  <text x="124" y="397" fill="#ffffff" font-size="11" font-weight="800">#1 SNEAK INTO BASKET</text>
  <rect x="135" y="421" width="20" height="20" rx="4" fill="#3b82f6" />
  <text x="170" y="436" fill="#f8fafc" font-size="15" font-weight="700">Pre-checked Add-On (+$14.99/mo)</text>

  <rect x="115" y="492" width="510" height="62" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2.5" />
