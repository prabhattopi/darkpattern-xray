  <text x="725" y="578" fill="#34d399" font-size="13" font-weight="800" letter-spacing="1">INSTANT CONSUMER DEFENSE</text>
  <text x="725" y="618" fill="#ffffff" font-size="22" font-weight="800">1-Click Legal Cancellation</text>
