<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="1200" height="800" fill="#111827" />
  
  <!-- Browser Header -->
  <rect x="0" y="0" width="1200" height="48" fill="#1f2937" />
  <circle cx="28" cy="24" r="7" fill="#ef4444" />
  <circle cx="52" cy="24" r="7" fill="#f59e0b" />
  <circle cx="76" cy="24" r="7" fill="#22c55e" />
  <rect x="120" y="10" width="960" height="28" rx="6" fill="#111827" />
  <text x="140" y="29" fill="#9ca3af" font-size="13">https://account.cloudnest-storage.example/billing/retention-step-4-of-6</text>

  <!-- Modal Card -->
  <rect x="180" y="80" width="840" height="655" rx="18" fill="#ffffff" />

  <!-- Warning Header -->
  <rect x="180" y="80" width="840" height="85" rx="18" fill="#fef2f2" />
  <text x="230" y="132" fill="#991b1b" font-size="26" font-weight="800">⚠️ Wait! Are you sure you want to lose EVERYTHING?</text>

  <!-- Scare Tactics Box -->
  <rect x="230" y="190" width="740" height="125" rx="12" fill="#fffbeb" stroke="#fde68a" />
  <text x="255" y="225" fill="#92400e" font-size="16" font-weight="700">If you leave now, the following irreversible actions occur IMMEDIATELY:</text>
  <text x="255" y="255" fill="#78350f" font-size="14">• All 412 GB of your family photos and backups will be permanently queued for deletion.</text>
  <text x="255" y="280" fill="#78350f" font-size="14">• Your Grandfathered Loyalty Tier will be forfeited forever (re-joining costs $39.99/mo).</text>
  <text x="255" y="303" fill="#78350f" font-size="13" font-style="italic">(Note: Free 15GB tier remains available per Terms §14.2, though hidden here)</text>

  <!-- Trick Question Checkbox -->
  <rect x="230" y="340" width="740" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <rect x="252" y="366" width="22" height="22" rx="4" fill="#2563eb" />
  <path d="M257 377 L261 382 L270 371" stroke="#ffffff" stroke-width="2.5" fill="none" />
  <text x="290" y="374" fill="#0f172a" font-size="14" font-weight="600">Uncheck this box if you do NOT wish to decline opting out of auto-renewal</text>
  <text x="290" y="398" fill="#475569" font-size="13">protection, which pauses cancellation for 90 days at $24.99/mo.</text>

  <!-- Roach Motel Phone Requirement -->
  <rect x="230" y="448" width="740" height="62" rx="10" fill="#f1f5f9" />
  <text x="255" y="484" fill="#334155" font-size="14" font-weight="600">📞 Final cancellation verification requires calling 1-800-555-0199 (Mon–Fri, 9am–11am EST only).</text>

  <!-- Visual Misdirection Buttons -->
  <rect x="230" y="540" width="740" height="68" rx="12" fill="#16a34a" />
  <text x="365" y="582" fill="#ffffff" font-size="22" font-weight="800">YES! Keep My Account and Protect My Files</text>

  <!-- Tiny Low-Contrast Cancel Link -->
  <text x="485" y="655" fill="#cbd5e1" font-size="11">proceed to step 5 of 6 to request cancellation form</text>
</svg>