<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="1200" height="800" fill="#0c4a6e" />

  <!-- Browser Bar -->
  <rect x="0" y="0" width="1200" height="48" fill="#082f49" />
  <circle cx="28" cy="24" r="7" fill="#ef4444" />
  <circle cx="52" cy="24" r="7" fill="#f59e0b" />
  <circle cx="76" cy="24" r="7" fill="#22c55e" />
  <rect x="120" y="10" width="960" height="28" rx="6" fill="#0c4a6e" />
  <text x="140" y="29" fill="#bae6fd" font-size="13">https://book.skyfare-express.example/flight/SFO-NYC/checkout</text>

  <!-- Main Card -->
  <rect x="70" y="75" width="1060" height="690" rx="16" fill="#ffffff" />

  <!-- Header -->
  <text x="115" y="132" fill="#0f172a" font-size="26" font-weight="800">SFO → JFK Nonstop Economy</text>
  <text x="115" y="160" fill="#475569" font-size="15">Search Result Fare: $129.00 Roundtrip</text>

  <!-- False Scarcity & Social Proof -->
  <rect x="115" y="182" width="600" height="54" rx="10" fill="#fef2f2" stroke="#fca5a5" />
  <text x="135" y="207" fill="#dc2626" font-size="14" font-weight="800">⚡ ONLY 1 SEAT LEFT AT THIS PRICE! 29 people are looking at this flight right now.</text>
  <text x="135" y="226" fill="#991b1b" font-size="12">Price jumps by $180 in 02:14 if you refresh or navigate back.</text>

  <!-- Pre-checked Travel Protection -->
  <rect x="115" y="260" width="600" height="115" rx="10" fill="#f0fdf4" stroke="#86efac" />
  <rect x="138" y="284" width="22" height="22" rx="4" fill="#16a34a" />
  <path d="M143 295 L147 300 L156 289" stroke="#ffffff" stroke-width="2.5" fill="none" />
  <text x="174" y="292" fill="#14532d" font-size="16" font-weight="700">Yes, protect my trip against delays and emergencies (+$68.00)</text>
  <text x="174" y="317" fill="#166534" font-size="13">Recommended for 99% of travelers. Coverage is non-refundable once issued.</text>
  <text x="174" y="352" fill="#94a3b8" font-size="11" text-decoration="underline">No, I want to risk losing my entire vacation investment if anything goes wrong.</text>

  <!-- Forced VIP Club Membership -->
  <rect x="115" y="395" width="600" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <rect x="138" y="420" width="22" height="22" rx="4" fill="#2563eb" />
  <path d="M143 431 L147 436 L156 425" stroke="#ffffff" stroke-width="2.5" fill="none" />
  <text x="174" y="428" fill="#0f172a" font-size="15" font-weight="700">Enroll in SkyFare Prime Club ($0 today, then $89.99/quarter)</text>
  <text x="174" y="452" fill="#64748b" font-size="13">Saves $5 on this booking! Auto-renews every 90 days until cancelled.</text>

  <!-- CTA -->
  <rect x="115" y="515" width="600" height="60" rx="12" fill="#ea580c" />
  <text x="275" y="552" fill="#ffffff" font-size="19" font-weight="800">Lock In My Ticket Now →</text>

  <!-- Right Fare Breakdown (Drip Pricing) -->
  <rect x="745" y="115" width="345" height="530" rx="14" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="770" y="158" fill="#0f172a" font-size="20" font-weight="800">Fare Breakdown</text>

  <text x="770" y="205" fill="#334155" font-size="15">Advertised Base Fare</text>
  <text x="1000" y="205" fill="#0f172a" font-size="15" font-weight="700">$129.00</text>

  <text x="770" y="245" fill="#334155" font-size="15">Trip Protection (Pre-checked)</text>
  <text x="1008" y="245" fill="#0f172a" font-size="15" font-weight="700">$68.00</text>

  <rect x="765" y="275" width="305" height="125" rx="8" fill="#fef2f2" stroke="#fecaca" />
  <text x="780" y="303" fill="#991b1b" font-size="14" font-weight="600">Carrier-Imposed Fuel Fee</text>
  <text x="1008" y="303" fill="#991b1b" font-size="14" font-weight="700">$74.00</text>
  <text x="780" y="335" fill="#991b1b" font-size="14" font-weight="600">Online Booking Convenience Fee</text>
  <text x="1008" y="335" fill="#991b1b" font-size="14" font-weight="700">$38.50</text>
  <text x="780" y="367" fill="#991b1b" font-size="14" font-weight="600">Seat Assignment Mandatory Fee</text>
  <text x="1008" y="367" fill="#991b1b" font-size="14" font-weight="700">$29.00</text>

  <line x1="770" y1="430" x2="1065" y2="430" stroke="#cbd5e1" stroke-width="2" />
  <text x="770" y="472" fill="#0f172a" font-size="18" font-weight="800">Total Charged</text>
  <text x="980" y="472" fill="#dc2626" font-size="22" font-weight="800">$338.50</text>
  <text x="770" y="502" fill="#64748b" font-size="12">+$209.50 in hidden fees + opt-in traps</text>
</svg>